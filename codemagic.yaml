workflows:
  android-release-apk:
    name: Build and Sign Native APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build Unsigned Release APK
        script: |
          # Find the root project directory by looking for settings.gradle
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            # Fallback to look for any build.gradle if settings.gradle is missing
            SETTINGS_FILE=$(find . -name "build.gradle*" | head -n 1)
          fi
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Building from root directory: $ROOT_DIR"
          cd "$ROOT_DIR"
          
          # Initialize a fresh wrapper at the true project root
          gradle wrapper
          chmod +x gradlew
          
          # Run the production release compile
          ./gradlew assembleRelease
      - name: Generate Keystore and Sign APK
        script: |
          APK_PATH=$(find . -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK file was not built."
            exit 1
          fi
          
          # Cleanly generate the production signing key
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore vishnupriya-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias vishnupriya \
            -storepass "VPH@Korutla2026" \
            -keypass "VPH@Korutla2026" \
            -dname "CN=Vishnu Priya Hospital, OU=Administration, O=Vishnu Priya Hospital, L=Korutla, ST=Telangana, C=IN"
          
          # Sign the raw binary package
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner" sign \
            --ks vishnupriya-key.jks \
            --ks-key-alias vishnupriya \
            --ks-pass pass:"VPH@Korutla2026" \
            --key-pass pass:"VPH@Korutla2026" \
            --out VishnuPriyaHospital-signed.apk \
            "$APK_PATH"
    artifacts:
      - "**/VishnuPriyaHospital-signed.apk"
      - "**/vishnupriya-key.jks"
