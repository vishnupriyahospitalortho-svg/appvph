workflows:
  android-release-apk:
    name: Build Signed Native APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Generate Keystore and Build Signed APK
        script: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ ! -f "vishnupriya-key.jks" ]; then
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore vishnupriya-key.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias vishnupriya \
              -storepass "VPH@Korutla2026" \
              -keypass "VPH@Korutla2026" \
              -dname "CN=Vishnu Priya Hospital, OU=Administration, O=Vishnu Priya Hospital, L=Korutla, ST=Telangana, C=IN"
          fi
          gradle assembleRelease
    artifacts:
      - "**/app/build/outputs/apk/release/*.apk"
      - "**/vishnupriya-key.jks"

