workflows:
  android-release-apk:
    name: Build Verified Native APK
    max_build_duration: 30
    environment:
      java: 17
      node: latest
    scripts:
      - name: Initialize Automated Production Wrapper
        script: |
          cd ~
          # Create a perfectly clean, standardized native app container
          npm install -g @capacitor/cli
          mkdir native-app && cd native-app
          
          # Initialize the container using your live website configuration
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "Vishnu Priya Hospital" "com.vishnupriyahospital.korutla" --web-dir=www --web-url="https://your-hospital-website.com"
          
          # Build out the native Android platform project structures
          mkdir www && touch www/index.html
          npx cap add android
          
          # Compile the clean release binary package
          cd android
          ./gradlew assembleRelease
          
          # Move the clean package to the root workspace directory for signing operations
          cp app/build/outputs/apk/release/app-release-unsigned.apk $CM_BUILD_DIR/app-release-unsigned.apk
      - name: Generate Certificate and Finalize Signing
        script: |
          cd $CM_BUILD_DIR
          # Securely generate your permanent signing key asset
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore vishnupriya-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias vishnupriya \
            -storepass "VPH@Korutla2026" \
            -keypass "VPH@Korutla2026" \
            -dname "CN=Vishnu Priya Hospital, OU=Administration, O=Vishnu Priya Hospital, L=Korutla, ST=Telangana, C=IN"
          
          # Attach the digital signature certificate tool to output the production app package
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner" sign \
            --ks vishnupriya-key.jks \
            --ks-key-alias vishnupriya \
            --ks-pass pass:"VPH@Korutla2026" \
            --key-pass pass:"VPH@Korutla2026" \
            --out VishnuPriyaHospital-signed.apk \
            app-release-unsigned.apk
    artifacts:
      - "VishnuPriyaHospital-signed.apk"
      - "vishnupriya-key.jks"
